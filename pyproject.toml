[project]
name = "aicc"
version = "0.1.0"
description = "AI Income Control Center - compliant, zero-cost freelance operations system"
requires-python = ">=3.11"
dependencies = []   # deliberately zero runtime dependencies: no supply chain, no pip-audit surface, fast CI

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = ["data", "site", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["data", "site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
