# The AI worker, proved through the path real client work actually takes.
#
# The first version of this workflow used `anthropics/claude-code-action`, and that was a
# meaningful mistake worth recording. The action ran Claude, so a green badge felt like proof.
# But `ClaudeWorker.execute` - the function a paid client job travels through - does not use the
# action. It shells out to `claude -p`. Proving the action works proves the action works; it says
# nothing about whether the production code path can invoke a model and get an answer back.
#
# So this workflow now installs the Claude Code CLI on the runner and runs
# `python -m aicc worker-proof`, which builds a real Job, hands it to the real ClaudeWorker, and
# then runs the real `pipeline.run` with the real independent reviewer. Same objects, same
# functions, same failure modes as a client job. If it passes here, the production path works.
#
# What makes the proof hard to fake:
#   * The expected answer is a nonce minted on the runner moments before the prompt is built. It
#     cannot be in a cached response, a fixture, or a training set.
#   * The comparison is exact. A model that wrote something plausible instead of the thing asked
#     for fails.
#   * A missing file is a failure, never a pass. The likeliest route to a false green is for
#     nothing to happen and for nobody to check.
#   * The pipeline leg fails if the run silently fell back to the rule-based worker - which is
#     correct runtime behaviour and a worthless proof.
#
# Billing:
#   * `CLAUDE_CODE_OAUTH_TOKEN` authenticates against the subscription. $0.00 cash.
#   * `ANTHROPIC_API_KEY` would bill per token. The first step FAILS THE RUN if that secret
#     exists at all, before any model call - reporting afterwards that billing was reachable
#     would be reporting a charge rather than preventing one.
#   * Public-repository Actions minutes are free, so the runner costs nothing.

name: Claude worker

on:
  # Daily, twenty-five minutes ahead of `health.yml` at 11:25 UTC, so every health run has a
  # proof minted the same morning to validate. The proof TTL is 48h
  # (`proof_transport.PROOF_TTL_HOURS`), which leaves exactly one missed run of margin before the
  # dashboard stops claiming the worker works.
  #
  # Daily rather than weekly on purpose: the likeliest way this system breaks quietly is a token
  # expiring, and a weekly cadence would leave the light green for days over a dead worker.
  # About 25 seconds a day, free on a public repository.
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "How much to prove"
        required: true
        default: "full"
        type: choice
        options:
          - full          # worker + reviewer pipeline
          - worker-only   # just the exact-answer worker test

# Minimum privilege: reads the repository, writes nothing back. Note what is absent:
# `id-token: write`. An earlier run failed with "Could not fetch an OIDC token" and the error's
# own suggestion was to add it - which would let this job mint identity tokens exchangeable for
# credentials elsewhere. Nothing here needs OIDC at all now that the action is gone.
permissions:
  contents: read

concurrency:
  group: claude-worker
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      # ------------------------------------------------------------ billing, before anything
      - name: Refuse to run if a paid credential exists
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_API_KEY" = "true" ]; then
            echo "::error title=Paid credential present::ANTHROPIC_API_KEY is set on this repository. Zero-cost mode forbids metered billing. Delete the secret, or lift the zero-cost rule deliberately first."
            exit 1
          fi
          if [ "$HAS_OAUTH" != "true" ]; then
            echo "::error title=No subscription credential::CLAUDE_CODE_OAUTH_TOKEN is not set. Run 'claude setup-token' and add it. The system will not substitute a paid key."
            exit 1
          fi
          echo "Subscription credential present; no paid credential present."

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # ------------------------------------------------------------ the real executor
      #
      # The native installer, per the official setup docs. This is what makes ClaudeWorker
      # genuinely available: `ClaudeWorker.available()` requires the CLI on PATH, not merely a
      # token, precisely so that a token alone can never turn the dashboard's AI Worker light
      # green over a pipeline where no AI can run.
      - name: Install the Claude Code CLI
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Confirm the executor is real
        run: |
          set -euo pipefail
          which claude
          claude --version

      # ------------------------------------------------------------ the proof
      - name: Prove the worker through the production path
        id: proof
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AICC_ACTOR: GITHUB_ACTIONS
          AICC_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          # Through the environment, never interpolated into the script body. `scope` is a closed
          # choice list today, but the habit is what keeps the next free-text input safe.
          # A scheduled run supplies no inputs, so AICC_SCOPE is empty and falls to the full
          # proof - which is what a daily unattended run should be doing.
          if [ "$AICC_SCOPE" = "worker-only" ]; then
            python -m aicc worker-proof --summary --out proof-report.json --attestation worker-proof-attestation.json --worker-only
          else
            python -m aicc worker-proof --summary --out proof-report.json --attestation worker-proof-attestation.json
          fi

      # The proof leaves this job as an ARTIFACT and never as a commit.
      #
      # This is the whole security argument. This job holds CLAUDE_CODE_OAUTH_TOKEN and runs
      # `claude -p` against a job brief - and briefs originate in marketplace listings, which this
      # project treats as untrusted external input everywhere else. Granting it `contents: write`
      # so it could commit its own verdict would put credential handling, untrusted-text
      # execution and repository write authority in one job, and a prompt that talked the worker
      # into writing a file would become a prompt that writes to the repository.
      #
      # So `health.yml` - which holds no Claude credential and never runs a model - downloads this
      # artifact, validates it against GitHub's own account of which run produced it, and commits
      # the derived state. See src/aicc/proof_transport.py.
      - name: Publish the proof as an artifact, never as a commit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-worker-proof
          path: |
            proof-report.json
            worker-proof-attestation.json
          if-no-files-found: warn
          retention-days: 14

      # Runs even when the proof failed, because a failed proof is exactly when the evidence
      # matters most and a green-only summary is the least useful kind.
      - name: Record cloud independence
        if: ${{ always() }}
        run: |
          {
            echo ""
            echo "### Cloud independence"
            echo ""
            echo "| Question | Answer |"
            echo "|---|---|"
            echo "| Mac required for job execution | **NO** |"
            echo "| Where this ran | GitHub-hosted \`${RUNNER_OS}\` runner, \`$(hostname)\` |"
            echo "| What ran | \`ClaudeWorker.execute\` -> \`claude -p\`, the same path a client job takes |"
            echo ""
            echo "Andres's Mac played no part in this run. It is currently needed only to push"
            echo "commits, because this repository has no automated push credential - which is a"
            echo "different thing from needing it to execute work."
          } >> "$GITHUB_STEP_SUMMARY"
