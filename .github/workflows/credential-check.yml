# Diagnose a credential that works on a laptop and fails on the runner.
#
# WHY THIS EXISTS, SEPARATELY FROM EVERYTHING ELSE
#
# The Claude worker returned `401 OAuth access token is invalid` on runs #3-#8. Run #8 used a
# token that had just been verified working locally, and the secret was written a minute before
# the run - so "the secret is stale" and "the token is dead" are both excluded. `ClaudeWorker`
# invokes `subprocess.run(cmd, ...)` with no `env=`, so the child inherits the token byte for
# byte and it never appears as an argument; nothing in our code can alter the value. The failure
# is therefore in the stored value or in the runner's CLI, and those cannot be told apart by
# looking at either from outside.
#
# This workflow is deliberately NOT a change to claude-worker.yml or health.yml. The proof
# transport keeps its shape: the credential-holding workflow still cannot write to the
# repository, and this one cannot either. It is an instrument, additive and read-only, and it can
# be deleted once the credential works.
#
# WHAT IT REPORTS, AND WHY EACH FIELD IS SAFE TO PRINT ON A PUBLIC REPOSITORY
#
# It never prints the token. It prints facts ABOUT the token:
#   * length                - fixed by the token format; reveals nothing about the value
#   * shape match           - a boolean against ^sk-ant-oat[0-9]*-[A-Za-z0-9_-]+$
#   * whitespace / quotes   - booleans; the most common way a pasted secret differs from the
#                             value that was copied, and invisible in the GitHub UI
#   * sha256, first 8 hex   - 32 bits of a one-way hash of a high-entropy secret. Not invertible
#                             and no faster to test guesses against than the real API. Its whole
#                             purpose is that Andres can run the same digest on his Mac and
#                             compare, which is the only way to establish byte-identity between
#                             a value he can see and one he cannot.
#
# GitHub masks the secret itself in logs automatically. It does not mask values derived from it,
# which is exactly why the derivation has to be chosen to be safe rather than assumed to be.

name: Credential check

on:
  workflow_dispatch: {}

# Reads the repository, writes nothing back - the same minimum the worker has. No `id-token`.
permissions:
  contents: read

concurrency:
  group: claude-worker # shares the worker's group: never diagnose while a proof run is in flight
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse to run if a paid credential exists
        env:
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_API_KEY" = "true" ]; then
            echo "::error title=Paid credential present::ANTHROPIC_API_KEY is set. Zero-cost mode forbids metered billing."
            exit 1
          fi
          echo "No paid credential present."

      # ---------------------------------------------------------------- 1. the stored value
      #
      # Through the environment, never interpolated into the script body: a ${{ }} expansion is
      # substituted as text before bash parses the line, so a quote inside a secret would break
      # out of the string. The value is read by python from os.environ and never echoed.
      - name: What is actually stored in the secret
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import hashlib
          import os
          import re

          tok = os.environ.get("TOKEN", "")
          stripped = tok.strip()

          rows = [
              ("Present", "yes" if tok else "NO"),
              ("Length", str(len(tok))),
              ("Matches sk-ant-oat...", "yes" if re.fullmatch(r"sk-ant-oat[0-9]*-[A-Za-z0-9_-]+", stripped) else "**NO**"),
              # Reported, not blamed. The first version of this row said "this alone causes a
              # 401", and two runs later a token WITH surrounding whitespace authenticated fine
              # while the stripped version of an earlier one still failed. The claim was a guess
              # wearing a finding's clothes - the exact thing this repository exists to not do.
              # Whitespace is worth seeing because it is invisible in the GitHub UI; whether it
              # is the cause is what the last two steps actually test.
              ("Leading/trailing whitespace", "yes (see the two auth tests below)" if tok != stripped else "no"),
              ("Internal whitespace or newline", "**YES**" if re.search(r"\s", stripped) else "no"),
              ("Wrapped in quotes", "**YES**" if len(stripped) > 1 and stripped[0] in "\"'" else "no"),
              ("sha256 (first 8 hex)", f"`{hashlib.sha256(tok.encode()).hexdigest()[:8]}`"),
              ("sha256 of stripped value", f"`{hashlib.sha256(stripped.encode()).hexdigest()[:8]}`"),
          ]

          print("### What is stored in CLAUDE_CODE_OAUTH_TOKEN")
          print("")
          print("The token itself is never printed. These are facts about it.")
          print("")
          print("| Property | Value |")
          print("|---|---|")
          for k, v in rows:
              print(f"| {k} | {v} |")
          print("")
          print("On your Mac, compare the digest with:")
          print("")
          print("```")
          print("printf %s \"$THE_TOKEN\" | shasum -a 256 | cut -c1-8")
          print("```")
          print("")
          print("Matching digest means the stored secret is byte-identical to the token that works")
          print("locally, and the fault is on the runner side. A different digest means the value")
          print("was altered on the way into the secret, and the two whitespace rows say how.")
          PY

      # ---------------------------------------------------------------- 2. the runner's CLI
      - name: Install the Claude Code CLI
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Which CLI this runner got
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### The CLI on this runner"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Path | \`$(which claude)\` |"
            echo "| Version | \`$(claude --version 2>&1 | head -1)\` |"
            echo ""
            echo "Compare with \`claude --version\` on your Mac. A different major version is a"
            echo "real candidate: the token works there and fails here, and the CLI is one of the"
            echo "few things that differs."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------- 3. is it us, or the token
      #
      # `claude -p` invoked directly by the shell, with nothing of ours in the path. If this
      # fails the same way, our Python is exonerated and the credential or the CLI is at fault.
      # If it SUCCEEDS, the fault is in how our code reaches the CLI, and the code read that says
      # otherwise is wrong.
      #
      # `continue-on-error` because a failure here is the finding, not an accident.
      - name: Does the CLI authenticate at all, outside our code
        id: direct
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          set +e
          out="$(claude -p 'Reply with the single word OK' 2>&1)"
          rc=$?
          set -e
          # Trimmed and fenced. Anything token-shaped would be masked by GitHub, and the CLI's
          # own error text is what we came for.
          {
            echo ""
            echo "### \`claude -p\` called directly by the shell"
            echo ""
            echo "Exit code: \`$rc\`"
            echo ""
            echo "\`\`\`"
            echo "$out" | head -c 1500
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # ---------------------------------------------------------------- 4. is whitespace the cause
      #
      # Run #1 of this workflow found leading/trailing whitespace in the stored secret, and a
      # different digest for the stripped value. That makes whitespace the likely cause, and
      # "likely" is not what anyone should act on: sending Andres to re-save a secret that turns
      # out to be the wrong token wastes a round trip and teaches him the diagnosis is guesswork.
      #
      # So the same value is tried again with nothing but the surrounding whitespace removed. If
      # that authenticates, whitespace WAS the entire fault and the token is correct.
      #
      # This proves a cause. It is NOT a fix, and deliberately does not become one: the worker
      # still passes the environment through untouched, because a system that silently repairs a
      # malformed credential hides the fact that the credential is malformed. The fix belongs in
      # the secret.
      - name: Would the same token work with the whitespace removed
        id: stripped
        continue-on-error: true
        env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          # Stripped in python and exported, so no shell quoting touches the value.
          CLAUDE_CODE_OAUTH_TOKEN="$(python3 -c 'import os; print(os.environ["RAW"].strip(), end="")')"
          export CLAUDE_CODE_OAUTH_TOKEN
          set +e
          out="$(claude -p 'Reply with the single word OK' 2>&1)"
          rc=$?
          set -e
          {
            echo ""
            echo "### The same token with surrounding whitespace removed"
            echo ""
            echo "Exit code: \`$rc\`"
            echo ""
            echo "\`\`\`"
            echo "$out" | head -c 800
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Read the result
        run: |
          set -euo pipefail
          {
            echo ""
            if [ "${{ steps.direct.outputs.rc }}" != "0" ] && [ "${{ steps.stripped.outputs.rc }}" = "0" ]; then
              echo "## Root cause: whitespace in the stored secret"
              echo ""
              echo "The same value authenticates once the surrounding whitespace is removed. The"
              echo "token is correct; the secret holds it with extra bytes around it, and the CLI"
              echo "sends what it is given. That is the whole of the 401."
              echo ""
              echo "Fix it in the secret, not in the code: re-save CLAUDE_CODE_OAUTH_TOKEN with no"
              echo "trailing newline or space. Then run the Claude worker at full scope."
            elif [ "${{ steps.direct.outputs.rc }}" = "0" ]; then
              echo "**The CLI authenticated.** The credential and the runner are fine, so the"
              echo "fault is between our code and the CLI - which contradicts the reading of"
              echo "\`ClaudeWorker.execute\`, and is the next thing to look at."
            else
              echo "**The CLI did not authenticate**, with nothing of ours involved. Our code is"
              echo "exonerated. Compare the digest above with your Mac's: equal means the token"
              echo "is being refused for this runner specifically, different means the value was"
              echo "altered on the way into the secret."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
