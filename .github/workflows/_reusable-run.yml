# Reusable job: checkout, run pipeline step(s), record the run, commit operational data back,
# and optionally build + publish the dashboard to GitHub Pages.
#
# Credentials (all optional; a missing one degrades the run instead of failing it, and the run
# summary says BLOCKED BY CREDENTIAL rather than reporting success):
#   CLAUDE_CODE_OAUTH_TOKEN - Claude subscription token from `claude setup-token`. $0.00 cash;
#                             draws against the Max subscription allowance. Absent -> the
#                             rule-based worker and reviewer run instead, and the dashboard
#                             reports the AI worker as NOT CONFIGURED.
name: _run

on:
  workflow_call:
    inputs:
      steps:
        description: "Shell commands to run, one per line"
        required: true
        type: string
      commit_message:
        required: true
        type: string
      sources:
        description: "Optional space-separated connector names. Reaches the shell via the environment, never via template interpolation."
        required: false
        default: ""
        type: string
      publish:
        description: "Also build and publish the dashboard"
        required: false
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write   # the rolling 'Needs you' issue is the only free notification channel

concurrency:
  group: aicc-repo-push
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      PYTHONPATH: src
      AICC_RUN_ID: ${{ github.run_id }}
      AICC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Reports what this step actually checked, which is whether a secret exists - and nothing
      # more. The previous wording said "AI worker: available" on secret presence alone, and it
      # was the first line of every job summary, directly above a health panel reporting the
      # worker as YELLOW and not operational. Both lines came from the same run. The secret can
      # be present while the CLI is absent from this runner, or present while the credential
      # returns 401, which is exactly what happened; the worker's real state comes from the
      # probe, and the probe reads a recorded end-to-end proof rather than a configuration flag.
      - name: Credential state
        run: |
          if [ "$HAS_CLAUDE" != "true" ]; then
            echo "::warning title=AI worker not configured::No CLAUDE_CODE_OAUTH_TOKEN secret. The rule-based worker and reviewer will run. See docs/DEPLOYMENT.md."
            echo "### AI worker credential: ABSENT (CLAUDE_CODE_OAUTH_TOKEN not set)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### AI worker credential: PRESENT (subscription, \$0.00 cash)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A credential is not a working worker. Whether it executes is reported by the AI Worker capability below, which reads the last end-to-end proof run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run pipeline step(s)
        id: pipeline
        continue-on-error: true
        # Both values reach the shell through the environment rather than being interpolated
        # into the script body. A ${{ }} expansion is substituted as TEXT before bash parses
        # the line, so a quote or a $(...) in the value would break out of the string and run.
        # Nothing untrusted reaches these inputs today - callers are checked-in workflow files -
        # but that is a property of the callers, not of this file, and the next edit that wires
        # a workflow_dispatch input into `steps` would silently create a command injection.
        # Passing through env removes the possibility rather than relying on nobody making it.
        env:
          AICC_STEPS: ${{ inputs.steps }}
          AICC_SOURCES: ${{ inputs.sources }}
        run: |
          # `pipefail` is load-bearing, not decoration: each step is piped into `tee` to capture
          # its output for the classifier below, and without pipefail the pipeline reports tee's
          # exit status. Every failing step would be reported as a success.
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          # Steps go through a file rather than a pipe into `while`. A piped loop runs in a
          # subshell, so an exit code recorded inside it is discarded when the subshell ends -
          # every failure would be reported as success.
          printf '%s\n' "$AICC_STEPS" > "$RUNNER_TEMP/steps.txt"
          rc=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::group::$line"
            if ! eval "$line" 2>&1 | tee -a "$RUNNER_TEMP/step.log"; then
              rc=1
              echo "::endgroup::"
              echo "::warning title=Step failed::$line"
              break
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/steps.txt"
          exit $rc

      # An exhausted Claude subscription window is not a broken pipeline. It looks identical to
      # one in a red badge, and treating them the same teaches the owner to ignore red badges -
      # so the failure is classified before it is allowed to fail the run. A usage window pauses
      # and says when to come back; a revoked token still fails, loudly, because only a person
      # can fix it. Deliberately never falls back to a paid API key: see src/aicc/degradation.py.
      - name: Classify an AI failure before failing the run
        if: ${{ steps.pipeline.outcome == 'failure' }}
        run: |
          python -m aicc ai-status --error "$(tail -c 4000 "$RUNNER_TEMP/step.log" 2>/dev/null)"

      # The only notification channel that is free and reliable: GitHub already emails the
      # repository owner about issues they are subscribed to. One rolling issue, edited in
      # place while the list changes and closed when it empties - so the owner hears about
      # entering and leaving the state of being needed, and nothing in between. A channel
      # that pings every run is one the owner stops reading.
      - name: Tell Andres what needs him
        if: ${{ always() }}
        continue-on-error: true
        run: python -m aicc notify --issue

      # Deliberately publishes even when the pipeline step failed, and the condition says so
      # explicitly rather than relying on Actions semantics (an explicit `if:` replaces the
      # implicit success() check, so this would run after a failure whether or not that was
      # intended - and a behaviour nobody chose is a behaviour nobody maintains).
      #
      # The reasoning: this dashboard's entire job is to report state honestly, and "the last
      # run failed" is state. Hiding it when something goes wrong is exactly backwards - the
      # moment the dashboard is most worth looking at is the moment it stops updating. The
      # publish gate still refuses a build that cannot evidence what it claims, so a broken
      # build is still never deployed over a working one.
      - name: Build and verify the dashboard
        id: build
        if: ${{ inputs.publish && (success() || failure()) }}
        run: |
          set -e
          python -m aicc build --out site
          if ! python -m aicc verify-site --site site; then
            echo "::error title=Dashboard NOT published::verification failed; the previous build stays live"
            echo "### Dashboard publish: REFUSED - verification failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload Pages artifact
        if: ${{ inputs.publish && steps.build.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: ${{ inputs.publish && steps.build.outcome == 'success' }}
        uses: actions/deploy-pages@v4

      - name: Run summary
        if: always()
        run: |
          python -m aicc status >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python -m aicc health >> "$GITHUB_STEP_SUMMARY" || true

      - name: Persist operational data
        if: always()
        env:
          AICC_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          git config user.name "aicc-bot"
          git config user.email "actions@users.noreply.github.com"
          # data/ holds public job listings and system state only. Client material lives in
          # workspaces/, which is gitignored and never reaches this step.
          git add data
          git diff --cached --quiet || git commit -m "$AICC_COMMIT_MESSAGE $(date -u +%F\ %H:%M) UTC"
          git pull --rebase -X theirs origin ${GITHUB_REF_NAME} || true
          git push || (git pull --rebase -X theirs origin ${GITHUB_REF_NAME} && git push)
